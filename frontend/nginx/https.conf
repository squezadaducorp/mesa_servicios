# Modo HTTPS (producción on-premise). Certificados montados en /etc/nginx/certs:
#   mesa.crt (certificado + cadena) y mesa.key
limit_req_zone $binary_remote_addr zone=aducorp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aducorp_api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/mesa.crt;
    ssl_certificate_key /etc/nginx/certs/mesa.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:aducorp_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/aducorp-comun.conf;
}
