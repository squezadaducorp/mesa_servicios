# Modo HTTP (desarrollo o cuando TLS termina en un balanceador externo)
limit_req_zone $binary_remote_addr zone=aducorp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aducorp_api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    include /etc/nginx/aducorp-comun.conf;
}
