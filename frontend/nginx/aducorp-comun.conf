# Bloques comunes del sitio (incluido por http.conf y https.conf)
root /usr/share/nginx/html;
index index.html;
server_tokens off;
client_max_body_size 25m;

include /etc/nginx/aducorp-cabeceras.conf;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Autenticación: límite de 10 solicitudes por minuto por IP (ráfaga de 5)
location /api/v1/auth/ {
    limit_req zone=aducorp_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    include /etc/nginx/aducorp-proxy.conf;
}

location /api/ {
    limit_req zone=aducorp_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    include /etc/nginx/aducorp-proxy.conf;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/aducorp-cabeceras.conf;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/aducorp-cabeceras.conf;
    try_files $uri $uri/ /index.html;
}
