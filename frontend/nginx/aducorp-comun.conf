# Bloques comunes del sitio (incluido por http.conf y https.conf)
root /usr/share/nginx/html;
index index.html;
server_tokens off;
client_max_body_size 25m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Autenticación: límite de 10 solicitudes por minuto por IP (ráfaga de 5)
location /api/v1/auth/ {
    limit_req zone=aducorp_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    include /etc/nginx/aducorp-proxy.conf;
}

location /api/ {
    limit_req zone=aducorp_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    include /etc/nginx/aducorp-proxy.conf;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
