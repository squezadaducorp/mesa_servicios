# Detrás de Cloudflare Tunnel todas las solicitudes llegan desde el contenedor cloudflared (red Docker privada).
# La IP real del usuario viene en CF-Connecting-IP; sin esto el límite de intentos de login sería compartido
# por todos los usuarios y la auditoría registraría la IP del túnel.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
