# Detrás de Caddy todas las solicitudes llegan desde su contenedor (red Docker privada). Caddy descarta
# el X-Forwarded-For que mande el navegador y pone la IP real del usuario; sin esto el límite de
# intentos de login sería compartido por todos y la auditoría registraría la IP de Caddy.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
