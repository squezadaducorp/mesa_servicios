# Escaneo de seguridad (mejora 41 · ISO 27001 A.8.8, A.8.25, A.8.28)
#  - gitleaks: contraseñas, claves o tokens subidos por error al repositorio
#  - Trivy: vulnerabilidades del sistema operativo y de las librerías DENTRO de las imágenes api y web
#  - SBOM (CycloneDX): lista exacta de componentes de cada imagen, guardada como artefacto
# Corre en cada PR, en cada push a main y todos los días a las 05:00 de Ecuador (aparecen CVE nuevas en librerías viejas).
# Un riesgo aceptado se registra en .trivyignore con su fecha de revisión.
name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * *"     # 05:00 en Ecuador (UTC-5)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos en el código (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Buscar secretos en todo el historial
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --config /repo/.gitleaks.toml --exit-code 1

  imagenes:
    name: Imagen ${{ matrix.imagen }} (Trivy + SBOM)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagen: mesa-api
            contexto: backend
          - imagen: mesa-web
            contexto: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Construir la imagen igual que en producción
        run: docker build -t ${{ matrix.imagen }}:escaneo ${{ matrix.contexto }}
      - name: Informe completo (todas las severidades)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.imagen }}:escaneo
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
          output: trivy-${{ matrix.imagen }}.txt
      - name: Lista de componentes (SBOM CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.imagen }}:escaneo
          format: cyclonedx
          output: sbom-${{ matrix.imagen }}.cdx.json
          skip-setup-trivy: true
      - name: Resumen en la ejecución
        if: always()
        run: |
          { echo "### ${{ matrix.imagen }}"; echo '```'; cat trivy-${{ matrix.imagen }}.txt 2>/dev/null | tail -n 80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seguridad-${{ matrix.imagen }}
          path: |
            trivy-${{ matrix.imagen }}.txt
            sbom-${{ matrix.imagen }}.cdx.json
          retention-days: 90
      - name: Bloquear si hay vulnerabilidades CRÍTICAS o ALTAS con corrección disponible
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.imagen }}:escaneo
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          skip-setup-trivy: true

  sqlserver:
    name: Imagen SQL Server (solo informe)
    # La imagen es de Microsoft: no la podemos parchar nosotros, pero conviene saber cuándo publicar una nueva (cambio estándar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Imagen usada en docker-compose.yml
        id: img
        run: echo "ref=$(grep -m1 -oE 'mcr.microsoft.com/mssql/server:[^"[:space:]]+' docker-compose.yml)" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          output: trivy-sqlserver.txt
      - name: Resumen
        run: |
          { echo "### SQL Server (${{ steps.img.outputs.ref }})"; echo '```'; tail -n 60 trivy-sqlserver.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
