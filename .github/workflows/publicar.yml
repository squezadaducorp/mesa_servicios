# Publicación de versiones: al crear una etiqueta vX.Y.Z se construyen y publican las imágenes en GHCR.
#   git tag v1.0.0 && git push origin v1.0.0
# En el servidor: REGISTRO=ghcr.io/<propietario> VERSION=1.0.0 en .env, luego
#   docker compose pull && docker compose up -d
name: Publicar imágenes

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write     # crear la versión (release) en GitHub
  packages: write     # publicar en ghcr.io

jobs:
  imagenes:
    name: Imagen ${{ matrix.imagen }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - imagen: mesa-api
            contexto: backend
          - imagen: mesa-web
            contexto: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Nombre del registro en minúsculas
        run: echo "REGISTRO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRO }}/${{ matrix.imagen }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

  version:
    name: Versión en GitHub
    needs: imagenes
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Crear la versión con notas automáticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Mesa de Servicios $GITHUB_REF_NAME"
